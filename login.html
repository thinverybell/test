<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đăng nhập học sinh — Thầy Gia Huy</title>
<meta name="description" content="Đăng nhập học sinh">
<link rel="icon" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@coreui/icons/css/free.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/icons.css"></head>
<body class="auth-page">
  <div class="auth-bg-layer" aria-hidden="true"></div>

  <nav class="auth-top-mode" aria-label="Chế độ tài khoản">
    <a class="auth-mode-btn" href="register">Tài khoản khách</a>
    <a class="auth-mode-btn active" href="login">Đăng nhập</a>
  </nav>

  <img class="logo-corner" src="assets/logo-giahuy.png" alt="Logo Gia Huy" width="220" height="90">

  <!-- Corner admin icon -->
  <a class="admin-corner" href="admin-login" title="Đăng nhập quản trị viên">
    <span class="admin-corner-ico"><i class="cil-cog"></i></span>
  </a>

  <div class="auth-wrap auth-frame">
    <div class="auth-card">
      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab active" data-tab="student" role="tab" aria-selected="true">Học sinh</button>
        <a class="auth-tab" href="teacher-login" style="text-decoration:none;text-align:center;display:flex;align-items:center;justify-content:center">Giáo viên</a>
      </div>

      <div class="auth-panels">
        <form class="auth-panel active" id="studentForm" data-panel="student" data-mode-panel="login" autocomplete="on">
          <label class="auth-field">
            <span>Tên đăng nhập</span>
            <input type="text" id="stuUser" placeholder="Tên đăng nhập" required maxlength="40">
          </label>
          <label class="auth-field">
            <span>Mã mời</span>
            <div class="pass-wrap">
              <input type="password" id="stuInvite" placeholder="Mã mời của học sinh" required maxlength="64" autocomplete="current-password">
              <button type="button" class="pass-toggle" aria-label="Hiện mã mời" title="Hiện / ẩn">
                <svg class="pass-eye-ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
              </button>
            </div>
          </label>
          <button type="submit" class="auth-submit">Đăng nhập</button>
        </form>

        <form class="auth-panel" id="guestRegisterForm" data-mode-panel="register" autocomplete="on" hidden>
          <label class="auth-field">
            <span>Tên đăng nhập</span>
            <input type="text" id="regUser" placeholder="Tên bạn muốn dùng" required maxlength="40">
          </label>
          <label class="auth-field">
            <span>Mật khẩu</span>
            <div class="pass-wrap">
              <input type="password" id="regPass" placeholder="A–Z, a–z, 0–9, @, -" required maxlength="64" autocomplete="new-password">
              <button type="button" class="pass-toggle" aria-label="Hiện mật khẩu" title="Hiện / ẩn">
                <svg class="pass-eye-ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
              </button>
            </div>
          </label>
          <label class="auth-field">
            <span>Nhập lại mật khẩu</span>
            <div class="pass-wrap">
              <input type="password" id="regPass2" placeholder="Nhập lại mật khẩu" required maxlength="64" autocomplete="new-password">
              <button type="button" class="pass-toggle" aria-label="Hiện mật khẩu" title="Hiện / ẩn">
                <svg class="pass-eye-ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
              </button>
            </div>
          </label>
          <button type="submit" class="auth-submit">Tạo tài khoản khách</button>
        </form>
      </div>
    </div>
  </div>

  <div class="auth-toast" id="authToast" hidden></div>

  <script src="js/api-config.js"></script><script src="js/auth.js"></script><script src="js/user-settings.js"></script>
  <script>
    (function(){
      const s = Auth.getSession();
      if (!s || !s.role) return;
      // ?stay=1 → ở lại form để đổi tài khoản
      if (/[?&]stay=1/.test(location.search)) return;
      if (s.role === 'admin' || s.role === 'teacher' || s.role === 'manager') location.replace('teacher');
      else location.replace('/');
    })();

    document.getElementById('studentForm').addEventListener('submit', async e => {
      e.preventDefault();
      const r = await Promise.resolve(Auth.loginStudent(
        document.getElementById('stuUser').value,
        document.getElementById('stuInvite').value
      ));
      if (!r || !r.ok) return Auth.toast((r && r.msg) || 'Lỗi đăng nhập', true);
      Auth.toast('Đăng nhập học sinh thành công');
      setTimeout(() => location.href = '/', 400);
    });

    function setAuthMode(mode) {
      const isReg = mode === 'register';
      document.getElementById('btnAuthRegister')?.classList.toggle('active', isReg);
      document.getElementById('btnAuthLogin')?.classList.toggle('active', !isReg);
      const loginForm = document.getElementById('studentForm');
      const regForm = document.getElementById('guestRegisterForm');
      if (loginForm) {
        loginForm.hidden = isReg;
        loginForm.classList.toggle('active', !isReg);
      }
      if (regForm) {
        regForm.hidden = !isReg;
        regForm.classList.toggle('active', isReg);
      }
      try {
        history.replaceState(null, '', isReg ? '#register' : '#login');
      } catch (_) {}
    }
    document.getElementById('btnAuthRegister')?.addEventListener('click', () => setAuthMode('register'));
    document.getElementById('btnAuthLogin')?.addEventListener('click', () => setAuthMode('login'));
    if (location.hash === '#register') setAuthMode('register');

    document.getElementById('guestRegisterForm')?.addEventListener('submit', async e => {
      e.preventDefault();
      const u = document.getElementById('regUser').value;
      const p1 = document.getElementById('regPass').value;
      const p2 = document.getElementById('regPass2').value;
      if (p1 !== p2) return Auth.toast('Mật khẩu nhập lại không khớp', true);
      const r = await Promise.resolve(Auth.registerGuest(u, p1));
      if (!r || !r.ok) return Auth.toast((r && r.msg) || 'Lỗi đăng ký', true);
      Auth.toast('Tài khoản khách thành công!');
      setTimeout(() => location.href = '/', 400);
    });
  
    // Hiện / ẩn mật khẩu (nút mắt)
    document.querySelectorAll('.pass-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const wrap = btn.closest('.pass-wrap');
        const input = wrap && wrap.querySelector('input');
        if (!input) return;
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        btn.setAttribute('aria-label', show ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
        btn.innerHTML = show ? '<svg class="pass-eye-ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M2.1 3.5 3.5 2.1l18.4 18.4-1.4 1.4-3.1-3.1A11.5 11.5 0 0 1 12 19c-7 0-10-7-10-7a18.6 18.6 0 0 1 5.2-5.6L2.1 3.5zM12 7a5 5 0 0 1 5 5c0 .7-.1 1.3-.4 1.9l-6.5-6.5c.6-.3 1.2-.4 1.9-.4zm-7.5 5s2.2 4.5 7.5 4.5c.8 0 1.5-.1 2.2-.3l-1.6-1.6A5 5 0 0 1 7.8 9.4L6.1 7.7C4.3 9 3.2 10.7 2.5 12z"/></svg>' : '<svg class="pass-eye-ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>';
      });
    });

  
    document.getElementById('btnAuthRegister')?.addEventListener('click', e => {
      e.preventDefault();
      document.querySelectorAll('.auth-mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === 'register'));
      Auth.toast('Đăng ký: nhận tài khoản + mã mời từ giáo viên của bạn, rồi quay lại Đăng nhập.');
    });

  </script>
<script src="js/icons.js"></script></body>
</html>
