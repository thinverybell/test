<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nghe nhạc — Gia Huy</title><link rel="icon" href="assets/favicon.svg"><link rel="stylesheet" href="assets/vendor/coreui/css/free.min.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/redesign.css"><link rel="stylesheet" href="css/gh-navigation-master.css"><style>body.music-page{margin:0;background:linear-gradient(135deg,#eff6ff,#f8fafc);min-height:100vh;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:#14213d}.music-shell{max-width:1180px;margin:0 auto;padding:32px 22px 60px}.music-hero{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:24px}.music-hero h1{margin:0;font-size:32px}.music-hero p{margin:8px 0;color:#64748b}.music-page-card{background:#fff;border:1px solid #dbe7f1;border-radius:24px;box-shadow:0 22px 70px rgba(15,23,42,.08);padding:24px}.music-page .music-now{display:flex;gap:24px;align-items:center;padding:20px;border-radius:20px;background:linear-gradient(135deg,#0b4f71,#0d739d);color:#fff}.music-page .music-cover{width:128px;height:128px;border-radius:22px;display:grid;place-items:center;background:rgba(255,255,255,.15);font-size:44px;box-shadow:inset 0 1px rgba(255,255,255,.35)}.music-page #nowMusic{font-size:24px;display:block}.music-page #nowArtist{opacity:.8;display:block;margin:4px 0 14px}.music-page .music-controls{display:flex;gap:8px;align-items:center}.music-page .music-controls button{width:40px;height:40px;border:0;border-radius:12px;background:rgba(255,255,255,.16);color:#fff;font-size:18px}.music-page .music-controls button:hover{background:rgba(255,255,255,.26)}.music-page .music-controls input{accent-color:#fff}.music-page .music-progress{display:flex;align-items:center;gap:10px;margin-top:12px}.music-page .music-progress input{flex:1}.music-page .music-list{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}.music-page .track-btn{display:flex;align-items:center;gap:12px;border:1px solid #e2e8f0;background:#fff;border-radius:16px;padding:14px;text-align:left;cursor:pointer}.music-page .track-btn:hover,.music-page .track-btn.active{border-color:#0ea5e9;box-shadow:0 10px 25px rgba(14,165,233,.12)}.music-page .track-icon{width:40px;height:40px;border-radius:12px;background:#e0f2fe;color:#0369a1;display:grid;place-items:center}.music-page .track-copy b,.music-page .track-copy small{display:block}.music-page .track-copy small{margin-top:4px;color:#64748b}.music-back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:#0369a1;font-weight:700}</style></head><body class="music-page"><main class="music-shell"><div class="music-hero"><div><a class="music-back" href="index.html">← Trang chủ</a><h1>Nghe nhạc cùng Gia Huy</h1><p>Playlist do quản trị viên upload, phát trực tiếp trên trình duyệt.</p></div><a class="music-back" href="admin-panel.html?tab=music">Quản lý playlist →</a></div><section class="music-page-card"><div class="music-now"><div class="music-cover"><i class="cil-music-note"></i></div><div style="flex:1"><b id="nowMusic">Chưa có nhạc</b><small id="nowArtist">Admin có thể upload playlist</small><div class="music-controls"><button id="musicPrev" type="button">‹</button><button id="musicPlay" type="button" aria-label="Phát nhạc"><i class="cil-media-play"></i></button><button id="musicNext" type="button">›</button><input id="musicVolume" max="1" min="0" step="0.01" type="range" value=".8" aria-label="Âm lượng"></div><div class="music-progress"><span id="musicCurrent">0:00</span><input id="musicSeek" max="100" min="0" step="0.1" type="range" value="0" aria-label="Tiến trình"><span id="musicDuration">0:00</span></div></div></div><div class="music-list" id="musicList"><div class="empty-state" style="padding:18px">Đang tải playlist...</div></div></section></main><div class="toast" id="toast"></div><script src="js/api-config.js"></script><script src="js/auth.js"></script><script src="js/user-settings.js"></script><script src="js/script.js"></script><script src="js/redesign.js"></script><script src="js/gh-navigation-master.js"></script></body></html>
