<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tài khoản khách — Thầy Gia Huy</title>
<meta name="description" content="Đăng ký / đăng nhập tài khoản khách">
<link rel="icon" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@coreui/icons/css/free.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/icons.css"></head>
<body class="auth-page">
  <div class="auth-bg-layer" aria-hidden="true"></div>

  <nav class="auth-top-mode" aria-label="Chế độ tài khoản">
    <a class="auth-mode-btn active" href="register.html">Tài khoản khách</a>
    <a class="auth-mode-btn" href="register.html#login" id="topLoginLink">Đăng nhập</a>
    <a class="auth-mode-btn" href="login.html" title="Học sinh / Giáo viên">HS / GV</a>
  </nav>

  <div class="auth-wrap auth-frame auth-frame-register">
    <div class="auth-card auth-card-register">
      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab active" data-guest-tab="register" role="tab" aria-selected="true">Đăng ký</button>
        <button type="button" class="auth-tab" data-guest-tab="login" role="tab" aria-selected="false">Đăng nhập</button>
      </div>

      <div class="auth-panels">
        <form class="auth-panel active" id="guestRegisterForm" data-guest-panel="register" autocomplete="on">
          <label class="auth-field">
            <span>Tên đăng nhập</span>
            <input type="text" id="regUser" placeholder="Tên bạn muốn dùng" required maxlength="40">
          </label>
          <label class="auth-field">
            <span>Mật khẩu</span>
            <div class="pass-wrap">
              <input type="password" id="regPass" placeholder="A–Z, a–z, 0–9, @, -" required maxlength="64" autocomplete="new-password">
              <button type="button" class="pass-toggle" aria-label="Hiện mật khẩu" title="Hiện / ẩn">
                <svg class="pass-eye-ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
              </button>
            </div>
          </label>
          <label class="auth-field">
            <span>Nhập lại mật khẩu</span>
            <div class="pass-wrap">
              <input type="password" id="regPass2" placeholder="Nhập lại mật khẩu" required maxlength="64" autocomplete="new-password">
              <button type="button" class="pass-toggle" aria-label="Hiện mật khẩu" title="Hiện / ẩn">
                <svg class="pass-eye-ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
              </button>
            </div>
          </label>
          <button type="submit" class="auth-submit">Tạo tài khoản khách</button>
        </form>

        <form class="auth-panel" id="guestLoginForm" data-guest-panel="login" autocomplete="on" hidden>
          <label class="auth-field">
            <span>Tên đăng nhập</span>
            <input type="text" id="gsUser" placeholder="Tên đăng nhập khách" required maxlength="40">
          </label>
          <label class="auth-field">
            <span>Mật khẩu</span>
            <div class="pass-wrap">
              <input type="password" id="gsPass" placeholder="Mật khẩu tài khoản khách" required maxlength="64" autocomplete="current-password">
              <button type="button" class="pass-toggle" aria-label="Hiện mật khẩu" title="Hiện / ẩn">
                <svg class="pass-eye-ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
              </button>
            </div>
          </label>
          <button type="submit" class="auth-submit">Đăng nhập</button>
        </form>
      </div>
    </div>
  </div>

  <div class="auth-toast" id="authToast" hidden></div>
  <script src="js/api-config.js"></script><script src="js/auth.js"></script><script src="js/user-settings.js"></script>
  <script>
    (function () {
      // Chỉ tự vào web nếu đã có phiên hợp lệ — không ép khi user chủ động mở trang đăng nhập
      const s = Auth.getSession();
      if (!s || !s.role) return;
      // Cho phép xem form đăng nhập để đổi tài khoản (?stay=1 hoặc #login)
      if (location.hash === '#login' || /[?&]stay=1/.test(location.search)) return;
      if (s.role === 'admin' || s.role === 'teacher' || s.role === 'manager') location.replace('teacher');
      else location.replace('/');
    })();

    function showGuestTab(tab) {
      document.querySelectorAll('[data-guest-tab]').forEach(b => {
        const on = b.dataset.guestTab === tab;
        b.classList.toggle('active', on);
        b.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      document.querySelectorAll('[data-guest-panel]').forEach(p => {
        const on = p.dataset.guestPanel === tab;
        p.hidden = !on;
        p.classList.toggle('active', on);
      });
      try { history.replaceState(null, '', tab === 'login' ? '#login' : '#register'); } catch (_) {}
    }
    document.querySelectorAll('[data-guest-tab]').forEach(b => {
      b.addEventListener('click', e => {
        e.preventDefault();
        e.stopPropagation();
        showGuestTab(b.dataset.guestTab);
      });
    });
    document.getElementById('topLoginLink')?.addEventListener('click', e => {
      e.preventDefault();
      showGuestTab('login');
    });
    if (location.hash === '#login') showGuestTab('login');

    document.getElementById('guestRegisterForm').addEventListener('submit', async e => {
      e.preventDefault();
      const u = document.getElementById('regUser').value;
      const p1 = document.getElementById('regPass').value;
      const p2 = document.getElementById('regPass2').value;
      if (p1 !== p2) return Auth.toast('Mật khẩu nhập lại không khớp', true);
      const r = await Promise.resolve(Auth.registerGuest(u, p1));
      if (!r || !r.ok) return Auth.toast((r && r.msg) || 'Lỗi đăng ký', true);
      Auth.toast('Đăng ký tài khoản khách thành công!');
      setTimeout(() => location.href = '/', 400);
    });

    document.getElementById('guestLoginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const r = await Promise.resolve(Auth.loginGuest(
        document.getElementById('gsUser').value,
        document.getElementById('gsPass').value
      ));
      if (!r || !r.ok) return Auth.toast((r && r.msg) || 'Lỗi đăng nhập', true);
      Auth.toast('Đăng nhập khách thành công');
      setTimeout(() => location.href = '/', 400);
    });

    document.querySelectorAll('.pass-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const wrap = btn.closest('.pass-wrap');
        const input = wrap && wrap.querySelector('input');
        if (!input) return;
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        btn.setAttribute('aria-label', show ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
        btn.innerHTML = show
          ? '<svg class="pass-eye-ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M2.1 3.5 3.5 2.1l18.4 18.4-1.4 1.4-3.1-3.1A11.5 11.5 0 0 1 12 19c-7 0-10-7-10-7a18.6 18.6 0 0 1 5.2-5.6L2.1 3.5zM12 7a5 5 0 0 1 5 5c0 .7-.1 1.3-.4 1.9l-6.5-6.5c.6-.3 1.2-.4 1.9-.4zm-7.5 5s2.2 4.5 7.5 4.5c.8 0 1.5-.1 2.2-.3l-1.6-1.6A5 5 0 0 1 7.8 9.4L6.1 7.7C4.3 9 3.2 10.7 2.5 12z"/></svg>'
          : '<svg class="pass-eye-ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>';
      });
    });
  </script>
<script src="js/icons.js"></script></body>
</html>
